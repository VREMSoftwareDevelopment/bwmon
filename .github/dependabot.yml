# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/react'
      schedule:
          interval: 'weekly'
      ignore:
          # Vitest 5 breaks @stryker-mutator/vitest-runner 10 (stryker-js#6210).
          # Remove once the runner ships the fix from stryker-js#6214.
          - dependency-name: 'vitest'
            update-types: ['version-update:semver-major']
          - dependency-name: '@vitest/coverage-v8'
            update-types: ['version-update:semver-major']
          # ESLint stays on 9.x: eslint-plugin-import, eslint-plugin-react and
          # eslint-plugin-jsx-a11y peer on eslint <= 9. @eslint/js must match eslint.
          - dependency-name: 'eslint'
            update-types: ['version-update:semver-major']
          - dependency-name: '@eslint/js'
            update-types: ['version-update:semver-major']
          # TypeScript stays on 6.x: typescript-eslint 8 peers on typescript <6.1.
          - dependency-name: 'typescript'
            update-types: ['version-update:semver-major']
